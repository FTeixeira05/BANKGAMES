<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sandy Bank - Hacker Hub</title>
    <style>
        /* ================= ESTILOS GERAIS ================= */
        body {
            background-color: #0b0f12;
            color: #e6edf3;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            background-image: radial-gradient(circle, #1a232c 0%, #0b0f12 80%);
        }

        .screen {
            width: 800px;
            height: 600px;
            position: relative;
            background: #161b22;
            border: 2px solid #30363d;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: none; 
            flex-direction: column;
            overflow: hidden;
        }

        .active-screen {
            display: flex; 
        }

        .btn-hub-return {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: 1px solid #8b949e;
            color: #8b949e;
            padding: 5px 10px;
            font-family: inherit;
            cursor: pointer;
            z-index: 100;
        }
        .btn-hub-return:hover { background: #8b949e; color: #0b0f12; }

        /* ================= HUB GERAL ================= */
        #hub-screen { align-items: center; justify-content: center; }
        .hub-title { font-size: 36px; color: #2ea043; margin-bottom: 40px; text-shadow: 0 0 10px rgba(46,160,67,0.5); letter-spacing: 4px; }
        .hub-menu { display: flex; flex-direction: column; gap: 20px; width: 400px; }
        .hub-btn {
            background: transparent;
            border: 2px solid #e3b341;
            color: #e3b341;
            padding: 15px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .hub-btn:hover { background: #e3b341; color: #0b0f12; box-shadow: 0 0 15px rgba(227, 179, 65, 0.4); }

        /* ================= JOGO 1: MEMORY BYPASS ================= */
        #g1-screen { align-items: center; justify-content: center; }
        .g1-header { color: #d2a8ff; font-size: 14px; margin-bottom: 50px; letter-spacing: 2px; }
        .g1-instruction { font-size: 20px; color: #e3b341; margin-bottom: 30px; height: 30px; }
        .g1-cells { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .g1-cell { width: 80px; height: 100px; background: rgba(255, 255, 255, 0.05); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; position: relative; }
        .g1-cell span { position: absolute; top: 5px; right: 8px; font-size: 12px; color: #aff5b4; }
        .g1-hidden { background: #ccff00 !important; color: transparent !important; }
        .g1-timer-container { width: 600px; height: 8px; background: #21262d; border-radius: 10px; overflow: hidden; }
        #g1-timer-bar { width: 100%; height: 100%; background: #e3b341; transition: width linear; }
        .g1-controls { margin-top: 20px; color: #8b949e; font-size: 14px; }

        /* ================= JOGO 2: MATH DROP ================= */
        .g2-header-bar { display: flex; justify-content: space-between; padding: 15px 20px; font-size: 14px; color: #d2a8ff; z-index: 10; }
        #g2-play-area { flex-grow: 1; position: relative; width: 100%; }
        .g2-block { position: absolute; width: 80px; height: 50px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.5); border-top: 5px solid #e3b341; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        #g2-bottom-section { height: 100px; width: 100%; background: #0d1117; z-index: 10; }
        #g2-danger-line { width: 100%; height: 8px; background: linear-gradient(90deg, #e3b341 0%, #fff 50%, #e3b341 100%); box-shadow: 0 0 10px #e3b341; }
        .g2-controls-area { display: flex; align-items: center; justify-content: center; gap: 15px; height: calc(100% - 8px); }
        .g2-btn { background: transparent; border: 1px solid rgba(255,255,255,0.6); color: #fff; width: 120px; height: 40px; font-family: inherit; font-size: 18px; cursor: pointer; }
        .g2-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
        .g2-btn:active:not(:disabled) { background: #e3b341; color: #000; }
        #g2-lives { color: #fff; font-size: 18px; letter-spacing: 4px; margin-right: 120px; }

        /* ================= JOGO 3: EQUATION COMPARE ================= */
        #g3-screen { align-items: center; justify-content: center; }
        .g3-title { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 40px; }
        .g3-equation-box { background: linear-gradient(90deg, rgba(20,30,40,0.8) 0%, rgba(30,50,40,0.9) 100%); border: 1px solid #2ea043; padding: 15px 40px; font-size: 32px; font-weight: bold; color: #fff; position: relative; width: 350px; text-align: center; }
        .g3-equation-box::after { content: ''; position: absolute; right: -20px; top: 0; bottom: 0; width: 20px; background: repeating-linear-gradient(90deg, #2ea043, #2ea043 2px, transparent 2px, transparent 4px); opacity: 0.7; }
        #g3-eq-bottom::after { right: auto; left: -20px; }
        .g3-controls { display: flex; gap: 20px; margin: 30px 0; }
        .g3-btn { background: transparent; border: 2px solid rgba(255,255,255,0.4); color: #fff; width: 60px; height: 60px; font-size: 30px; font-family: inherit; cursor: pointer; }
        .g3-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: #fff; }
        .g3-btn:active:not(:disabled) { background: #fff; color: #000; }
        .g3-footer-time { position: absolute; bottom: 30px; width: 90%; display: flex; align-items: center; gap: 15px; font-size: 18px; color: #fff; }
        .g3-time-container { flex-grow: 1; height: 15px; background: #fff; overflow: hidden; }
        #g3-time-bar { width: 100%; height: 100%; background: #e3b341; transform-origin: left; }

        /* ================= OVERLAYS DE MSG (COMPARTILHADOS) ================= */
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11, 15, 18, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; display: none; }
        .overlay-msg { font-size: 32px; color: #e3b341; margin-bottom: 30px; letter-spacing: 2px; text-align: center; }
        .overlay-buttons { display: flex; gap: 20px; }
        .start-btn { background: transparent; border: 2px solid #e3b341; color: #e3b341; padding: 10px 25px; font-size: 20px; cursor: pointer; font-family: inherit; font-weight: bold; }
        .start-btn:hover { background: #e3b341; color: #0b0f12; }
        .btn-green { border-color: #2ea043; color: #2ea043; }
        .btn-green:hover { background: #2ea043; color: #0b0f12; }
    </style>
</head>
<body>

    <div id="hub-screen" class="screen active-screen">
        <div class="hub-title">SANDY_BANK TERMINAL</div>
        <div class="hub-menu">
            <button class="hub-btn" onclick="openGame(1)">[1] MEMORY BYPASS</button>
            <button class="hub-btn" onclick="openGame(2)">[2] MATH INJECTION</button>
            <button class="hub-btn" onclick="openGame(3)">[3] EQUATION CRACKER</button>
        </div>
    </div>

    <div id="g1-screen" class="screen">
        <button class="btn-hub-return" onclick="returnToHub()">[X] ABORTAR</button>
        
        <div id="g1-overlay" class="overlay" style="display:flex;">
            <div id="g1-overlay-msg" class="overlay-msg">MEMORY BYPASS</div>
            <div class="overlay-buttons">
                <button class="start-btn" id="g1-btn-main" onclick="g1_init()">INICIAR HACK</button>
                <button class="start-btn btn-green" id="g1-btn-next" style="display:none;" onclick="openGame(2)">PRÓXIMO HACK</button>
            </div>
        </div>

        <div class="g1-header">SANDY_BANK <span id="g1-progress">0/13</span></div>
        <div class="g1-instruction" id="g1-msg">GET READY</div>
        <div class="g1-cells">
            <div class="g1-cell" id="g1-c1"><span>1</span><div class="val"></div></div>
            <div class="g1-cell" id="g1-c2"><span>2</span><div class="val"></div></div>
            <div class="g1-cell" id="g1-c3"><span>3</span><div class="val"></div></div>
        </div>
        <div class="g1-timer-container"><div id="g1-timer-bar"></div></div>
        <div class="g1-controls" id="g1-hint">AGUARDE...</div>
    </div>

    <div id="g2-screen" class="screen">
        <button class="btn-hub-return" onclick="returnToHub()">[X] ABORTAR</button>
        
        <div id="g2-overlay" class="overlay" style="display:flex;">
            <div id="g2-overlay-msg" class="overlay-msg">MATH INJECTION</div>
            <div class="overlay-buttons">
                <button class="start-btn" id="g2-btn-main" onclick="g2_init()">INICIAR HACK</button>
                <button class="start-btn btn-green" id="g2-btn-next" style="display:none;" onclick="openGame(3)">PRÓXIMO HACK</button>
            </div>
        </div>

        <div class="g2-header-bar">
            <span>SANDY_BANK</span>
            <span id="g2-lives">♥♥♥</span>
        </div>
        <div id="g2-play-area"></div>
        <div id="g2-bottom-section">
            <div id="g2-danger-line"></div>
            <div class="g2-controls-area">
                <span style="color:#fff; font-weight:bold; margin-right:10px;">//INPUT</span>
                <button class="g2-btn" id="g2-btn0" disabled>-</button>
                <button class="g2-btn" id="g2-btn1" disabled>-</button>
                <button class="g2-btn" id="g2-btn2" disabled>-</button>
            </div>
        </div>
    </div>

    <div id="g3-screen" class="screen">
        <button class="btn-hub-return" onclick="returnToHub()">[X] ABORTAR</button>
        
        <div id="g3-overlay" class="overlay" style="display:flex;">
            <div id="g3-overlay-msg" class="overlay-msg">EQUATION CRACKER</div>
            <div class="overlay-buttons">
                <button class="start-btn" id="g3-btn-main" onclick="g3_init()">INICIAR HACK</button>
                <button class="start-btn btn-green" id="g3-btn-next" style="display:none;" onclick="returnToHub()">VOLTAR AO TERMINAL</button>
            </div>
        </div>

        <div class="g3-title" id="g3-round-display">PICK THE CORRECT SIGN (1/7)</div>
        <div class="g3-equation-box" id="g3-eq-top">(0 * 0) + 0</div>
        <div class="g3-controls">
            <button class="g3-btn" id="g3-btn-less">&lt;</button>
            <button class="g3-btn" id="g3-btn-equal">=</button>
            <button class="g3-btn" id="g3-btn-greater">&gt;</button>
        </div>
        <div class="g3-equation-box" id="g3-eq-bottom">(0 + 0) * 0</div>
        <div class="g3-footer-time">
            <span>// TIME LEFT</span>
            <div class="g3-time-container"><div id="g3-time-bar"></div></div>
        </div>
    </div>

<script>
    // ================= CONTROLE DO HUB =================
    let activeGame = 0; 

    function openGame(gameId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(`g${gameId}-screen`).classList.add('active-screen');
        
        // Reseta as overlays
        document.getElementById(`g${gameId}-overlay`).style.display = 'flex';
        document.getElementById(`g${gameId}-overlay-msg`).style.color = '#e3b341';
        
        // Esconde os botões de "PRÓXIMO" e reseta texto do botão principal
        document.getElementById(`g${gameId}-btn-main`).innerText = "INICIAR HACK";
        document.getElementById(`g${gameId}-btn-next`).style.display = "none";
        
        if(gameId === 1) document.getElementById('g1-overlay-msg').innerText = "MEMORY BYPASS";
        if(gameId === 2) document.getElementById('g2-overlay-msg').innerText = "MATH INJECTION";
        if(gameId === 3) document.getElementById('g3-overlay-msg').innerText = "EQUATION CRACKER";

        activeGame = gameId;
    }

    function returnToHub() {
        // Para qualquer jogo que esteja rodando
        g1_isPlaying = false; clearTimeout(g1_timer);
        g2_isPlaying = false; cancelAnimationFrame(g2_gameLoop); clearInterval(g2_spawnTimer); clearInterval(g2_countdown);
        g3_isPlaying = false; cancelAnimationFrame(g3_timerLoop);

        activeGame = 0;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('hub-screen').classList.add('active-screen');
    }

    // ================= EVENTOS DE TECLADO GLOBAIS =================
    window.addEventListener('keydown', (e) => {
        if (activeGame === 1 && g1_isPlaying && g1_waitingAnswer) {
            if (e.key === "ArrowLeft") g1_checkAnswer(false);
            if (e.key === "ArrowRight") g1_checkAnswer(true);
        }
        else if (activeGame === 2 && g2_isPlaying) {
            if (e.key === '1' || e.key === 'ArrowLeft') document.getElementById('g2-btn0').click();
            if (e.key === '2' || e.key === 'ArrowDown') document.getElementById('g2-btn1').click();
            if (e.key === '3' || e.key === 'ArrowRight') document.getElementById('g2-btn2').click();
        }
        else if (activeGame === 3 && g3_isPlaying) {
            if (e.key === 'ArrowLeft') g3_checkAnswer('<');
            if (e.key === 'ArrowDown') g3_checkAnswer('=');
            if (e.key === 'ArrowRight') g3_checkAnswer('>');
        }
    });

    // ================= JOGO 1: MEMORY BYPASS =================
    let g1_sequence = [], g1_currentIndex = 0, g1_timer, g1_isPlaying = false, g1_waitingAnswer = false;
    const g1_totalSteps = 13;
    const g1_cells = [document.getElementById('g1-c1'), document.getElementById('g1-c2'), document.getElementById('g1-c3')];

    function g1_init() {
        document.getElementById('g1-overlay').style.display = 'none';
        g1_sequence = Array.from({length: g1_totalSteps + 3}, () => ['X', 'Y', 'Z'][Math.floor(Math.random() * 3)]);
        g1_currentIndex = 0;
        g1_isPlaying = true;
        g1_waitingAnswer = false;
        
        g1_cells[0].classList.remove('g1-hidden');
        g1_cells[1].classList.remove('g1-hidden');
        document.getElementById('g1-progress').innerText = "0/13";
        
        document.getElementById('g1-msg').innerText = "MEMORIZE A SEQUÊNCIA";
        document.getElementById('g1-hint').innerText = "PREPARE-SE";
        
        g1_updateCells(0);
        g1_startTimer(5000, g1_startQuestion);
    }

    function g1_startQuestion() {
        if (!g1_isPlaying) return;
        if (g1_currentIndex >= g1_totalSteps) {
            g1_endGame("SYSTEM HACKED", true);
            return;
        }

        g1_waitingAnswer = true;
        document.getElementById('g1-msg').innerText = "A visível é igual à primeira?";
        document.getElementById('g1-progress').innerText = `${g1_currentIndex + 1}/${g1_totalSteps}`;
        document.getElementById('g1-hint').innerText = "← NÃO  |  SIM →";

        g1_cells[0].classList.add('g1-hidden');
        g1_cells[1].classList.add('g1-hidden');
        g1_updateCells(g1_currentIndex);

        g1_startTimer(5000, () => g1_endGame("TEMPO ESGOTADO", false));
    }

    function g1_checkAnswer(answer) {
        if(!g1_waitingAnswer) return;
        g1_waitingAnswer = false;
        
        const isMatch = g1_sequence[g1_currentIndex] === g1_sequence[g1_currentIndex + 2];
        if (answer === isMatch) {
            g1_currentIndex++;
            g1_startQuestion();
        } else {
            g1_endGame("ACESSO NEGADO", false);
        }
    }

    function g1_updateCells(idx) {
        g1_cells[0].querySelector('.val').innerText = g1_sequence[idx];
        g1_cells[1].querySelector('.val').innerText = g1_sequence[idx + 1];
        g1_cells[2].querySelector('.val').innerText = g1_sequence[idx + 2];
    }

    function g1_startTimer(ms, callback) {
        clearInterval(g1_timer);
        let bar = document.getElementById('g1-timer-bar');
        bar.style.transition = 'none';
        bar.style.width = '100%';
        setTimeout(() => {
            bar.style.transition = `width ${ms}ms linear`;
            bar.style.width = '0%';
        }, 10);
        g1_timer = setTimeout(callback, ms);
    }

    function g1_endGame(msg, success) {
        g1_isPlaying = false;
        g1_waitingAnswer = false;
        clearInterval(g1_timer);
        let overlay = document.getElementById('g1-overlay');
        let overlayMsg = document.getElementById('g1-overlay-msg');
        let btnMain = document.getElementById('g1-btn-main');
        let btnNext = document.getElementById('g1-btn-next');

        overlay.style.display = 'flex';
        overlayMsg.innerText = msg;
        overlayMsg.style.color = success ? '#aff5b4' : '#ff7b72';
        
        if (success) {
            btnMain.innerText = "REINICIAR";
            btnNext.style.display = "block"; // Mostra o botão "Próximo"
        } else {
            btnMain.innerText = "TENTAR NOVAMENTE";
            btnNext.style.display = "none";
        }
    }

    // ================= JOGO 2: MATH DROP =================
    let g2_lives = 3, g2_isPlaying = false, g2_blocks = [], g2_gameLoop, g2_spawnTimer, g2_countdown, g2_timeLeft = 25;
    let g2_fallSpeed = 1.3, g2_speedMult = 0.001;
    const g2_playArea = document.getElementById('g2-play-area');
    const g2_btns = [document.getElementById('g2-btn0'), document.getElementById('g2-btn1'), document.getElementById('g2-btn2')];

    function g2_init() {
        document.getElementById('g2-overlay').style.display = 'none';
        g2_lives = 3; g2_timeLeft = 25; g2_fallSpeed = 1.3;
        document.getElementById('g2-lives').innerText = '♥♥♥';
        g2_blocks.forEach(b => b.el.remove()); g2_blocks = [];
        g2_btns.forEach(btn => { btn.innerText = "-"; btn.disabled = false; });
        g2_isPlaying = true;
        
        g2_gameLoop = requestAnimationFrame(g2_update);
        g2_spawnTimer = setInterval(g2_spawnBlock, 1200);
        g2_spawnBlock();
        
        g2_countdown = setInterval(() => {
            if(!g2_isPlaying) return;
            g2_timeLeft--;
            if(g2_timeLeft <= 0) g2_endGame("SYSTEM HACKED", true);
        }, 1000);
    }

    function g2_spawnBlock() {
        if (!g2_isPlaying) return;
        const math = g2_generateMath();
        const el = document.createElement('div');
        el.className = 'g2-block'; el.innerText = math.text;
        el.style.left = (Math.random() * (g2_playArea.clientWidth - 80)) + 'px';
        el.style.top = '-50px';
        g2_playArea.appendChild(el);
        g2_blocks.push({el: el, y: -50, answer: math.ans});
        if (g2_blocks.length === 1) g2_updateBtns();
    }

    function g2_generateMath() {
        const type = ['+', '-', '·'][Math.floor(Math.random() * 3)];
        let a, b, ans;
        if (type === '+') { a = Math.floor(Math.random() * 15)+1; b = Math.floor(Math.random() * 15)+1; ans = a+b; }
        else if (type === '-') { a = Math.floor(Math.random() * 20)+10; b = Math.floor(Math.random() * a)+1; ans = a-b; }
        else { a = Math.floor(Math.random() * 10)+2; b = Math.floor(Math.random() * 10)+2; ans = a*b; }
        return { text: `${a}${type}${b}`, ans: ans };
    }

    function g2_update() {
        if (!g2_isPlaying) return;
        let dangerY = g2_playArea.clientHeight - 10;
        for (let i = 0; i < g2_blocks.length; i++) {
            let b = g2_blocks[i];
            b.y += g2_fallSpeed; b.el.style.top = b.y + 'px';
            if (b.y + 50 >= dangerY) {
                b.el.remove(); g2_blocks.splice(i, 1); i--;
                g2_loseLife(); g2_updateBtns();
            }
        }
        g2_fallSpeed += g2_speedMult;
        g2_gameLoop = requestAnimationFrame(g2_update);
    }

    function g2_updateBtns() {
        if (!g2_isPlaying) return;
        if (g2_blocks.length === 0) { g2_btns.forEach(btn => btn.innerText = "-"); return; }
        let t = g2_blocks[0].answer;
        let w1 = t + Math.floor(Math.random() * 5) + 1;
        let w2 = t - Math.floor(Math.random() * 5) - 1;
        if (w2 < 0) w2 = t + 6;
        let opts = [t, w1, w2].sort(() => Math.random() - 0.5);
        g2_btns.forEach((btn, i) => { btn.innerText = opts[i]; btn.onclick = () => g2_checkAnswer(opts[i]); });
    }

    function g2_checkAnswer(val) {
        if (!g2_isPlaying || g2_blocks.length === 0) return;
        if (val === g2_blocks[0].answer) {
            g2_blocks[0].el.remove(); g2_blocks.shift(); g2_updateBtns();
        } else { g2_loseLife(); }
    }

    function g2_loseLife() {
        g2_lives--;
        document.getElementById('g2-lives').innerText = '♥'.repeat(Math.max(0, g2_lives)) + '♡'.repeat(3 - Math.max(0, g2_lives));
        g2_playArea.style.background = 'rgba(255, 0, 0, 0.2)';
        setTimeout(() => g2_playArea.style.background = 'transparent', 100);
        if (g2_lives <= 0) g2_endGame("SYSTEM FAILURE", false);
    }

    function g2_endGame(msg, success) {
        g2_isPlaying = false;
        cancelAnimationFrame(g2_gameLoop); clearInterval(g2_spawnTimer); clearInterval(g2_countdown);
        g2_btns.forEach(btn => { btn.disabled = true; });
        if(success) g2_blocks.forEach(b => b.el.remove());
        
        let overlay = document.getElementById('g2-overlay');
        let overlayMsg = document.getElementById('g2-overlay-msg');
        let btnMain = document.getElementById('g2-btn-main');
        let btnNext = document.getElementById('g2-btn-next');

        overlay.style.display = 'flex';
        overlayMsg.innerText = msg;
        overlayMsg.style.color = success ? '#aff5b4' : '#ff7b72';
        
        if (success) {
            btnMain.innerText = "REINICIAR";
            btnNext.style.display = "block";
        } else {
            btnMain.innerText = "TENTAR NOVAMENTE";
            btnNext.style.display = "none";
        }
    }

    // ================= JOGO 3: EQUATION COMPARE =================
    let g3_currentRound = 1, g3_isPlaying = false, g3_startTime, g3_timerLoop, g3_valTop, g3_valBottom;
    const g3_totalTime = 40000;

    function g3_init() {
        document.getElementById('g3-overlay').style.display = 'none';
        g3_currentRound = 1;
        g3_isPlaying = true;
        g3_startTime = Date.now();
        g3_nextRound();
        g3_timerLoop = requestAnimationFrame(g3_updateTimer);
    }

    function g3_updateTimer() {
        if (!g3_isPlaying) return;
        let rem = g3_totalTime - (Date.now() - g3_startTime);
        let pct = Math.max(0, (rem / g3_totalTime) * 100);
        let bar = document.getElementById('g3-time-bar');
        bar.style.width = pct + '%';
        bar.style.background = pct < 25 ? '#ff7b72' : '#e3b341';
        
        if (rem <= 0) g3_endGame("TIME OUT", false);
        else g3_timerLoop = requestAnimationFrame(g3_updateTimer);
    }

    function g3_nextRound() {
        document.getElementById('g3-round-display').innerText = `PICK THE CORRECT SIGN (${g3_currentRound}/7)`;
        const eq1 = g3_genEq(); const eq2 = g3_genEq();
        document.getElementById('g3-eq-top').innerText = eq1.text; g3_valTop = eq1.val;
        document.getElementById('g3-eq-bottom').innerText = eq2.text; g3_valBottom = eq2.val;
    }

    function g3_genEq() {
        const ops = ['+', '-', '*'];
        let a = Math.floor(Math.random() * 20)+1, b = Math.floor(Math.random() * 10)+1, c = Math.floor(Math.random() * 10)+1;
        let op1 = ops[Math.floor(Math.random()*3)], op2 = ops[Math.floor(Math.random()*3)];
        if (op1 === '-' && a < b) { let temp = a; a = b; b = temp; }
        let val1 = op1 === '+' ? a+b : op1 === '-' ? a-b : a*b;
        if (op2 === '-' && val1 < c) op2 = '+';
        let valF = op2 === '+' ? val1+c : op2 === '-' ? val1-c : val1*c;
        return { text: `(${a} ${op1} ${b}) ${op2} ${c}`, val: valF };
    }

    function g3_checkAnswer(sign) {
        if (!g3_isPlaying) return;
        let correct = g3_valTop > g3_valBottom ? '>' : g3_valTop < g3_valBottom ? '<' : '=';
        if (sign === correct) {
            if (g3_currentRound >= 7) g3_endGame("SYSTEM HACKED", true);
            else { g3_currentRound++; g3_nextRound(); }
        } else {
            g3_endGame("ACESSO NEGADO", false);
        }
    }

    function g3_endGame(msg, success) {
        g3_isPlaying = false;
        cancelAnimationFrame(g3_timerLoop);
        
        let overlay = document.getElementById('g3-overlay');
        let overlayMsg = document.getElementById('g3-overlay-msg');
        let btnMain = document.getElementById('g3-btn-main');
        let btnNext = document.getElementById('g3-btn-next');

        overlay.style.display = 'flex';
        overlayMsg.innerText = msg;
        overlayMsg.style.color = success ? '#aff5b4' : '#ff7b72';
        
        if (success) {
            btnMain.innerText = "REINICIAR";
            btnNext.style.display = "block";
        } else {
            btnMain.innerText = "TENTAR NOVAMENTE";
            btnNext.style.display = "none";
        }
    }

    document.getElementById('g3-btn-less').onclick = () => g3_checkAnswer('<');
    document.getElementById('g3-btn-equal').onclick = () => g3_checkAnswer('=');
    document.getElementById('g3-btn-greater').onclick = () => g3_checkAnswer('>');

</script>
